<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">

  <title>Frontend Mentor | Order summary card</title>
</head>

<body>
  <main>
    <article class="plan-card">

      <img src="./images/illustration-hero.svg" alt="Illustration of a girl vibing at a city night" />

      <div class="plan-content">
        <h1 class="title">Order Summary</h1>

        <p class="subtitle">You can now listen to millions of songs, audiobooks, and podcasts on any
          device anywhere you like!
        </p>

        <div class="flex-group">
          <img src="./images/icon-music.svg" />
          <div class="plan-details">
            <p class="plan-name">Annual Plan</p>
            <p>$59.99/year</p>
          </div>
          <button class="action">Change</button>
        </div>

        <button class="button-submit">Proceed to Payment</button>
        <button class="button-cancel">Cancel Order</button>
      </div>

    </article>

  </main>

</body>

</html>
